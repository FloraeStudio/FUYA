# 標語下面的小標籤與短文（短文一行一句，會依序浮現）
hero_eyebrow: WELCOME TO MY LITTLE STORY SHOP
hero_text: |-
  世界很大，故事很多。
  而我想慢慢把它們寫下來。
  收集那些不經意的心動、沒有說出口的話，
  以及每一段值得被記住的相遇。
hero_sign: ✿ A PLACE WHERE STORIES BLOOM ✿

# 小小自我介紹區塊（一行一段）
intro_title: 你好，歡迎來到我的小小故事收藏室。
intro_text: |-
  我總覺得，這個世界上有好多好多故事。
  它們藏在某一次擦肩而過的眼神裡、藏在午後沒有喝完的咖啡裡，也藏在那些明明很平凡，卻讓人忍不住記住的瞬間。
  於是，我開始寫字。
  把遇見的人、想像的世界、說不出口的情緒，以及那些稍縱即逝的心動，一點一點地寫下來。
  如果你也喜歡故事，歡迎在這裡坐坐。
intro_closing: 今天想為你留一份什麼樣的故事呢？

status_line: 冷門節日企劃ing
