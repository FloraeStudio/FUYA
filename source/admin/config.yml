backend:
  name: github
  repo: FloraeStudio/FUYA   # 換成實際 repo 路徑
  branch: main
  base_url: https://fuya-cms-oauth.vercel.app

media_folder: source/images/uploads
public_folder: /images/uploads

publish_mode: simple
locale: zh_Hant

collections:
  - name: projects
    label: 企劃
    label_singular: 一篇企劃
    folder: source/_posts/projects
    create: true
    slug: '{{slug}}'
    summary: '{{title}}｜{{fields.date}}'
    sortableFields: ['title', 'date', 'is_series', 'pin']
    fields:
      - { label: 標題, name: title, widget: string }
      - { label: 日期, name: date, widget: datetime }
      - label: 📌 置頂
        name: pin
        widget: boolean
        default: false
        hint: 開啟後這篇會固定顯示在「企劃系列內頁列表」與首頁「最近寫的字」的最上方，不受日期影響。用於重要公告或想長期曝光的作品，一般文章不需要開啟。
      - { label: 分類, name: categories, widget: hidden, default: [企劃] }
      - label: 是否為連載作品（同人／二創）
        name: is_series
        widget: boolean
        default: false
        hint: 大部分單篇展示作品請維持「否」。只有連載中的同人／二創才勾選。
      - label: 作品狀態
        name: status
        widget: select
        required: false
        options: [連載中, 已完結, 暫停]
        hint: 只有上面勾選為連載作品時才需要填寫。
      - label: 所屬企劃系列
        name: project_group
        widget: select
        required: false
        options:
          - { label: 十二個情人節, value: valentines }
          - { label: 冷門節日企劃, value: holidays }
          - { label: "拾光籤", value: "shiguangqian" }
        hint: 這篇屬於哪個長期企劃就選哪個，之後會自動出現在對應的企劃內頁。單篇作品不屬於任何系列時留空即可。
      - { label: 摘要, name: description, widget: text, required: false }
      - label: 標籤 Hashtags
        name: tags
        widget: list
        required: false
        hint: 用逗號分開，例如：夢向BG, 教官, 全年齡。每個標籤在文章頁會變成可點擊的 # 連結，點下去會列出所有貼過同標籤的文章。
      - label: 提醒標籤
        name: notices
        widget: list
        required: false
        hint: 每則一行，直接打字後按「新增」即可，例如「夢向BG」「角色姓名打碼」。顯示時會自動加上「※」。這裡是給讀者的提醒文字，不是分類用的 hashtag，兩者不同。
      - label: 相關連結
        name: links
        widget: list
        required: false
        summary: '{{fields.label}}'
        fields:
          - { label: 顯示文字, name: label, widget: string }
          - { label: 網址, name: url, widget: string }
        hint: 例如轉蛋台網址、企劃說明文件連結。留空則不顯示這一區。
      - { label: 封面圖, name: cover, widget: image, required: false }
      - { label: 內文, name: body, widget: markdown }

  - name: site_settings
    label: 首頁設定
    files:
      - name: homepage
        label: 首頁小狀態
        file: source/_data/site.yml
        fields:
          - label: 首頁介紹
            name: homepage_intro
            widget: text
            hint: 簡單的介紹文字
          - label: 近況小狀態
            name: status_line
            widget: string
            required: false
            hint: 顯示在介紹文字下方的一小行，可以做為近況小狀態用。留空就不顯示這一行。

  - name: commission_settings
    label: 委託狀態與排程
    files:
      - name: status
        label: 接單狀態與排程
        file: source/_data/commission.yml
        fields:
          - label: 接單狀態
            name: accepting_status
            widget: select
            options: [開放中, 已額滿, 暫停接單]
            hint: 顯示在委託頁最上方的「目前狀態」，跟下面貼的委託成品文章無關，獨立控制。
          - label: 後台網址
            name: api_url
            widget: string
            required: false
            hint: 委託後台的網址（例如 https://fuya-admin.vercel.app，結尾不用加斜線）。填了以後月曆與狀態會即時讀後台；留空或後台連不上時，會改顯示下面手動填的內容。
          - label: 本月名額（總數）
            name: slots_total
            widget: number
            value_type: int
            min: 0
            max: 12
            default: 4
            hint: 設 0 就不顯示名額標籤。
          - label: 本月名額（還剩幾個）
            name: slots_open
            widget: number
            value_type: int
            min: 0
            max: 12
            default: 4
            hint: 亮燈的點數 = 還能接幾個。
          - label: 預估排單等待
            name: wait_estimate
            widget: string
            required: false
            hint: 例如「約 3 週」。留空就不顯示這個標籤。
          - label: 排程中的委託
            name: schedule
            widget: list
            required: false
            summary: '{{fields.id}}｜{{fields.type}}｜交件 {{fields.end}}'
            hint: 這裡的內容會公開顯示在委託頁的月曆上。只填單號或代稱，不要放委託人的名字、帳號或聯絡方式。
            fields:
              - { label: 單號或代稱, name: id, widget: string, hint: '公開顯示。例如 K-0917' }
              - label: 方案
                name: type
                widget: select
                options:
                  - { label: 驚喜包, value: surprise }
                  - { label: 短篇小品, value: short }
                  - { label: 非商業委託, value: medium }
                  - { label: 長篇, value: long }
              - { label: 開始日, name: start, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD' }
              - { label: 預計交件日, name: end, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD' }
              - { label: 已完成, name: done, widget: boolean, default: false, hint: '開啟後橫條會變淡，仍留在月曆上。' }
              - { label: 公開顯示, name: public, widget: boolean, default: true, hint: '關閉後這一筆完全不會出現在網站上。' }
              - { label: 公開備註, name: note, widget: string, required: false, hint: '手機版會顯示在這一筆下方，例如「撰寫中」。' }
          - label: 月曆備註與休息日
            name: marks
            widget: list
            required: false
            summary: '{{fields.date}}｜{{fields.text}}'
            fields:
              - { label: 日期, name: date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD' }
              - { label: 文字, name: text, widget: string, required: false, hint: '顯示在那一格裡，例如「休息」「11 月名額開放」。' }
              - { label: 休息日, name: rest, widget: boolean, default: false, hint: '開啟後那一格底色會稍微暗一點。' }

  - name: gacha
    label: 轉蛋
    label_singular: 一則轉蛋
    folder: source/_posts/gacha
    create: true
    slug: '{{slug}}'
    summary: '{{title}}｜{{fields.date}}'
    sortableFields: ['title', 'date', 'pin']
    fields:
      - { label: 標題, name: title, widget: string }
      - { label: 日期, name: date, widget: datetime }
      - label: 📌 置頂
        name: pin
        widget: boolean
        default: false
        hint: 開啟後這篇會固定顯示在「轉蛋列表」與首頁「最近寫的字」的最上方，不受日期影響。用於重要公告或想長期曝光的作品，一般文章不需要開啟。
      - { label: 分類, name: categories, widget: hidden, default: [轉蛋] }
      - { label: 摘要, name: description, widget: text, required: false }
      - label: 標籤 Hashtags
        name: tags
        widget: list
        required: false
        hint: 用逗號分開，例如：夢向BG, 教官, 全年齡。每個標籤在文章頁會變成可點擊的 # 連結，點下去會列出所有貼過同標籤的文章。
      - label: 提醒標籤
        name: notices
        widget: list
        required: false
        hint: 每則一行，直接打字後按「新增」即可，例如「夢向BG」「角色姓名打碼」。顯示時會自動加上「※」。這裡是給讀者的提醒文字，不是分類用的 hashtag，兩者不同。
      - label: 相關連結
        name: links
        widget: list
        required: false
        summary: '{{fields.label}}'
        fields:
          - { label: 顯示文字, name: label, widget: string }
          - { label: 網址, name: url, widget: string }
        hint: 例如轉蛋台網址。留空則不顯示這一區。
      - { label: 封面圖, name: cover, widget: image, required: false }
      - { label: 內文, name: body, widget: markdown }

  - name: commission
    label: 委託
    label_singular: 一篇委託成品
    folder: source/_posts/commission
    create: true
    slug: '{{slug}}'
    summary: '{{title}}｜{{fields.date}}'
    sortableFields: ['title', 'date', 'pin']
    fields:
      - { label: 標題, name: title, widget: string }
      - { label: 日期, name: date, widget: datetime }
      - label: 📌 置頂
        name: pin
        widget: boolean
        default: false
        hint: 開啟後這篇會固定顯示在「委託成品列表」與首頁「最近寫的字」的最上方，不受日期影響。用於重要公告或想長期曝光的作品，一般文章不需要開啟。
      - { label: 分類, name: categories, widget: hidden, default: [委託] }
      - label: 方案類別
        name: plan_tier
        widget: select
        required: false
        options:
          - { label: 驚喜包, value: surprise }
          - { label: 短篇小品, value: short }
          - { label: 非商業委託, value: medium }
          - { label: 長篇, value: long }
        hint: 這篇成品是哪個方案的委託，會顯示為小標籤。不確定或不想顯示就留空。
      - { label: 摘要, name: description, widget: text, required: false }
      - label: 標籤 Hashtags
        name: tags
        widget: list
        required: false
        hint: 用逗號分開。每個標籤在文章頁會變成可點擊的 # 連結，點下去會列出所有貼過同標籤的文章。
      - label: 提醒標籤
        name: notices
        widget: list
        required: false
        hint: 每則一行，直接打字後按「新增」即可，例如注意事項、雷區提醒。顯示時會自動加上「※」。這裡是給讀者的提醒文字，不是分類用的 hashtag，兩者不同。
      - label: 相關連結
        name: links
        widget: list
        required: false
        summary: '{{fields.label}}'
        fields:
          - { label: 顯示文字, name: label, widget: string }
          - { label: 網址, name: url, widget: string }
        hint: 例如委託單網址、參考範例連結。留空則不顯示這一區。
      - { label: 內文, name: body, widget: markdown }

  - name: misc
    label: 雜談
    label_singular: 一篇雜談
    folder: source/_posts/misc
    create: true
    slug: '{{slug}}'
    summary: '{{title}}｜{{fields.date}}'
    sortableFields: ['title', 'date', 'pin']
    fields:
      - { label: 標題, name: title, widget: string }
      - { label: 日期, name: date, widget: datetime }
      - label: 📌 置頂
        name: pin
        widget: boolean
        default: false
        hint: 開啟後這篇會固定顯示在「雜談列表」與首頁「最近寫的字」的最上方，不受日期影響。用於重要公告或想長期曝光的作品，一般文章不需要開啟。
      - { label: 分類, name: categories, widget: hidden, default: [雜談] }
      - { label: 摘要, name: description, widget: text, required: false }
      - label: 標籤 Hashtags
        name: tags
        widget: list
        required: false
        hint: 用逗號分開。每個標籤在文章頁會變成可點擊的 # 連結，點下去會列出所有貼過同標籤的文章。
      - label: 提醒標籤
        name: notices
        widget: list
        required: false
        hint: 每則一行，直接打字後按「新增」即可。顯示時會自動加上「※」。這裡是給讀者的提醒文字，不是分類用的 hashtag，兩者不同。
      - label: 相關連結
        name: links
        widget: list
        required: false
        summary: '{{fields.label}}'
        fields:
          - { label: 顯示文字, name: label, widget: string }
          - { label: 網址, name: url, widget: string }
        hint: 留空則不顯示這一區。
      - { label: 內文, name: body, widget: markdown }