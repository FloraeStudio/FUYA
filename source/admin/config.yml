backend:
  name: github
  repo: FloraeStudio/FUYA   # 換成實際 repo 路徑
  branch: main
  base_url: https://fuya-cms-oauth.vercel.app

media_folder: source/images/uploads
public_folder: /images/uploads

publish_mode: simple
locale: zh_Hant

collections:
  - name: site_settings
    label: 首頁設定
    files:
      - name: homepage
        label: 首頁小狀態
        file: source/_data/site.yml
        fields:
          - label: 首頁介紹
            name: homepage_intro
            widget: text
            hint: 簡單的介紹文字
          - label: 近況小狀態
            name: status_line
            widget: string
            required: false
            hint: 顯示在介紹文字下方的一小行，可以做為近況小狀態用。留空就不顯示這一行。

  - name: commission_settings
    label: 委託狀態與排程
    files:
      - name: status
        label: 接單狀態與排程
        file: source/_data/commission.yml
        fields:
          - label: 接單狀態
            name: accepting_status
            widget: select
            options: [開放中, 已額滿, 暫停接單]
            hint: 顯示在委託頁最上方的「目前狀態」，跟下面貼的委託成品文章無關，獨立控制。
          - label: 後台網址
            name: api_url
            widget: string
            required: false
            hint: 委託後台的網址（例如 https://fuya-admin.vercel.app，結尾不用加斜線）。填了以後交稿排程與狀態會即時讀後台；留空或後台連不上時，會改顯示下面手動填的內容。
          - label: 本月名額（總數）
            name: slots_total
            widget: number
            value_type: int
            min: 0
            max: 12
            default: 4
            hint: 設 0 就不顯示名額標籤。
          - label: 本月名額（還剩幾個）
            name: slots_open
            widget: number
            value_type: int
            min: 0
            max: 12
            default: 4
            hint: 亮燈的點數 = 還能接幾個。
          - label: 預估排單等待
            name: wait_estimate
            widget: string
            required: false
            hint: 例如「約 3 週」。留空就不顯示這個標籤。
          - label: 排程中的委託
            name: schedule
            widget: list
            required: false
            summary: '{{fields.id}}｜{{fields.type}}｜交稿 {{fields.end}}'
            hint: 這裡的內容會公開顯示在委託頁的交稿排程上。只填單號或代稱，不要放委託人的名字、帳號或聯絡方式。
            fields:
              - { label: 單號或代稱, name: id, widget: string, hint: '公開顯示。例如 K-0917' }
              - label: 方案
                name: type
                widget: select
                options:
                  - { label: 驚喜包, value: surprise }
                  - { label: 短篇小品, value: short }
                  - { label: 非商業委託, value: medium }
                  - { label: 長篇, value: long }
                  - { label: 轉蛋台, value: egg }
              - { label: 開始日, name: start, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD' }
              - { label: 預計交稿日, name: end, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD', hint: '你自己安排的交稿日期，交稿排程顯示這個日期。' }
              - { label: 已完成, name: done, widget: boolean, default: false, hint: '開啟後這一筆會標示「已完成」，再留 14 天就自動從交稿排程消失。' }
              - { label: 公開顯示, name: public, widget: boolean, default: true, hint: '關閉後這一筆完全不會出現在網站上。' }
              - { label: 公開備註, name: note, widget: string, required: false, hint: '顯示在這一筆下方，例如「撰寫中」。' }
          - label: 月曆備註與休息日
            name: marks
            widget: list
            required: false
            summary: '{{fields.date}}｜{{fields.text}}'
            fields:
              - { label: 日期, name: date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD' }
              - { label: 文字, name: text, widget: string, required: false, hint: '顯示在交稿排程裡那一天，例如「休息」「11 月名額開放」。' }
              - { label: 休息日, name: rest, widget: boolean, default: false, hint: '開啟後會以淡色的休息日顯示在排程裡。' }
