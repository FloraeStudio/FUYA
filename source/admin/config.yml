backend:
  name: github
  repo: FloraeStudio/FUYA   # 換成實際 repo 路徑
  branch: main
  base_url: https://fuya-cms-oauth.vercel.app

media_folder: source/images/uploads
public_folder: /images/uploads

publish_mode: simple
locale: zh_Hant

collections:
  - name: projects
    label: 企劃
    label_singular: 一篇企劃
    folder: source/_posts/projects
    create: true
    slug: '{{slug}}'
    summary: '{{title}}｜{{fields.date}}{{fields.is_series ? "｜" + fields.status : ""}}'
    sortableFields: ['title', 'date', 'is_series']
    fields:
      - { label: 標題, name: title, widget: string }
      - { label: 日期, name: date, widget: datetime }
      - { label: 分類, name: categories, widget: hidden, default: [企劃] }
      - label: 是否為連載作品（同人／二創）
        name: is_series
        widget: boolean
        default: false
        hint: 大部分單篇展示作品請維持「否」。只有連載中的同人／二創才勾選。
      - label: 作品狀態
        name: status
        widget: select
        required: false
        options: [連載中, 已完結, 暫停]
        hint: 只有上面勾選為連載作品時才需要填寫。
      - label: 所屬企劃系列
        name: project_group
        widget: select
        required: false
        options:
          - { label: 十二個情人節, value: valentines }
          - { label: 冷門節日企劃, value: holidays }
        hint: 這篇屬於哪個長期企劃就選哪個，之後會自動出現在對應的企劃內頁。單篇作品不屬於任何系列時留空即可。
      - { label: 摘要, name: description, widget: text, required: false }
      - label: 標籤 Hashtags
        name: tags
        widget: list
        required: false
        hint: 用逗號分開，例如：夢向BG, 教官, 全年齡。每個標籤在文章頁會變成可點擊的 # 連結，點下去會列出所有貼過同標籤的文章。
      - label: 提醒標籤
        name: notices
        widget: list
        required: false
        summary: '{{fields.text}}'
        field: { label: 標籤, name: text, widget: string }
        hint: 每則一行，例如「夢向BG」「角色姓名打碼」。顯示時會自動加上「※」。這裡是給讀者的提醒文字，不是分類用的 hashtag，兩者不同。
      - label: 相關連結
        name: links
        widget: list
        required: false
        summary: '{{fields.label}}'
        fields:
          - { label: 顯示文字, name: label, widget: string }
          - { label: 網址, name: url, widget: string }
        hint: 例如轉蛋台網址、企劃說明文件連結。留空則不顯示這一區。
      - { label: 封面圖, name: cover, widget: image, required: false }
      - { label: 內文, name: body, widget: markdown }

  - name: site_settings
    label: 首頁設定
    files:
      - name: homepage
        label: 首頁小狀態
        file: source/_data/site.yml
        fields:
          - label: 首頁介紹
            name: homepage_intro
            widget: text
            hint: 簡單的介紹文字
          - label: 近況小狀態
            name: status_line
            widget: string
            required: false
            hint: 顯示在介紹文字下方的一小行，可以做為近況小狀態用。留空就不顯示這一行。

  - name: gacha
    label: 轉蛋
    label_singular: 一則轉蛋
    folder: source/_posts/gacha
    create: true
    slug: '{{slug}}'
    summary: '{{title}}｜{{fields.date}}'
    sortableFields: ['title', 'date']
    fields:
      - { label: 標題, name: title, widget: string }
      - { label: 日期, name: date, widget: datetime }
      - { label: 分類, name: categories, widget: hidden, default: [轉蛋] }
      - { label: 摘要, name: description, widget: text, required: false }
      - label: 標籤 Hashtags
        name: tags
        widget: list
        required: false
        hint: 用逗號分開，例如：夢向BG, 教官, 全年齡。每個標籤在文章頁會變成可點擊的 # 連結，點下去會列出所有貼過同標籤的文章。
      - label: 提醒標籤
        name: notices
        widget: list
        required: false
        summary: '{{fields.text}}'
        field: { label: 標籤, name: text, widget: string }
        hint: 每則一行，例如「夢向BG」「角色姓名打碼」。顯示時會自動加上「※」。這裡是給讀者的提醒文字，不是分類用的 hashtag，兩者不同。
      - label: 相關連結
        name: links
        widget: list
        required: false
        summary: '{{fields.label}}'
        fields:
          - { label: 顯示文字, name: label, widget: string }
          - { label: 網址, name: url, widget: string }
        hint: 例如轉蛋台網址。留空則不顯示這一區。
      - { label: 封面圖, name: cover, widget: image, required: false }
      - { label: 內文, name: body, widget: markdown }

  - name: commission
    label: 委託
    label_singular: 一則委託公告
    folder: source/_posts/commission
    create: true
    slug: '{{slug}}'
    summary: '{{title}}｜{{fields.date}}｜{{fields.status}}'
    sortableFields: ['title', 'date', 'status']
    fields:
      - { label: 標題, name: title, widget: string }
      - { label: 日期, name: date, widget: datetime }
      - { label: 分類, name: categories, widget: hidden, default: [委託] }
      - label: 狀態
        name: status
        widget: select
        required: false
        options: [開放中, 已額滿, 暫停接單]
      - { label: 摘要, name: description, widget: text, required: false }
      - label: 標籤 Hashtags
        name: tags
        widget: list
        required: false
        hint: 用逗號分開。每個標籤在文章頁會變成可點擊的 # 連結，點下去會列出所有貼過同標籤的文章。
      - label: 提醒標籤
        name: notices
        widget: list
        required: false
        summary: '{{fields.text}}'
        field: { label: 標籤, name: text, widget: string }
        hint: 每則一行，例如注意事項、雷區提醒。顯示時會自動加上「※」。這裡是給讀者的提醒文字，不是分類用的 hashtag，兩者不同。
      - label: 相關連結
        name: links
        widget: list
        required: false
        summary: '{{fields.label}}'
        fields:
          - { label: 顯示文字, name: label, widget: string }
          - { label: 網址, name: url, widget: string }
        hint: 例如委託單網址、參考範例連結。留空則不顯示這一區。
      - { label: 內文, name: body, widget: markdown }

  - name: misc
    label: 雜談
    label_singular: 一篇雜談
    folder: source/_posts/misc
    create: true
    slug: '{{slug}}'
    summary: '{{title}}｜{{fields.date}}'
    sortableFields: ['title', 'date']
    fields:
      - { label: 標題, name: title, widget: string }
      - { label: 日期, name: date, widget: datetime }
      - { label: 分類, name: categories, widget: hidden, default: [雜談] }
      - { label: 摘要, name: description, widget: text, required: false }
      - label: 標籤 Hashtags
        name: tags
        widget: list
        required: false
        hint: 用逗號分開。每個標籤在文章頁會變成可點擊的 # 連結，點下去會列出所有貼過同標籤的文章。
      - label: 提醒標籤
        name: notices
        widget: list
        required: false
        summary: '{{fields.text}}'
        field: { label: 標籤, name: text, widget: string }
        hint: 每則一行。顯示時會自動加上「※」。這裡是給讀者的提醒文字，不是分類用的 hashtag，兩者不同。
      - label: 相關連結
        name: links
        widget: list
        required: false
        summary: '{{fields.label}}'
        fields:
          - { label: 顯示文字, name: label, widget: string }
          - { label: 網址, name: url, widget: string }
        hint: 留空則不顯示這一區。
      - { label: 內文, name: body, widget: markdown }