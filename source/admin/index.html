<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <title>芙婭・後台</title>
  <style>
    /*
      低風險後台微調
      只針對原生 HTML 表單元素（button / input / textarea / select / label）下手，
      不使用 Decap CMS 內部那些會隨版本更新變動的 class name，
      所以升級 decap-cms 版本時這段不會失效或衝突。
    */

    body,
    input,
    textarea,
    select,
    button {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
        'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="search"],
    input[type="url"],
    input[type="number"],
    textarea,
    select {
      border-radius: 6px !important;
      font-size: 16px !important; /* 避免手機輸入時畫面自動放大 */
    }

    textarea {
      line-height: 1.7 !important;
    }

    button {
      border-radius: 6px !important;
      cursor: pointer;
      transition: opacity .15s ease, transform .1s ease;
    }

    button:hover {
      opacity: .85;
    }

    button:active {
      transform: scale(0.97);
    }

    label {
      letter-spacing: .3px;
    }
  </style>
</head>
<body>
  <!-- 版本鎖定，之後要升級再手動改這行 -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    /*
      自訂編輯器按鈕（對應 _config.yml 已關閉 marked.breaks、
      layout.css 已補上 hr／blockquote 樣式）：
      - 引用／題辭：轉成 markdown 的 `>` 引用語法，對應網站上左側細線＋斜體的樣式。
      - 分隔線：插入 `---`，對應網站上漸層淡出的分隔線樣式。

      停頓（小停頓 <br><br>／大停頓 <br><br><br>）不做成按鈕：
      Decap CMS 的自訂編輯器元件一律會被畫成可展開的大卡片，
      塞兩三個字元進去比例會很奇怪，直接手動打 <br><br> / <br><br><br>
      比較乾淨，網站上顯示效果完全一樣。

      提醒：下面這兩顆按鈕插入的內容跟你手動打字是等價的純文字，
      按鈕只是省去手動輸入；
      重新打開文章時不一定會自動變回「可點擊的卡片」，
      但插入的 >／--- 本身在網站上一定會照樣正確顯示。
    */

    // 引用／題辭：多行文字，逐行加上 `> ` 變成 blockquote
    CMS.registerEditorComponent({
      id: 'quote-block',
      label: '❝ 引用／題辭',
      fields: [
        { name: 'text', label: '引用內容（可多行）', widget: 'text' }
      ],
      pattern: /^((?:>\s?.*\n?)+)$/,
      fromBlock: function (match) {
        var text = match[1]
          .split('\n')
          .filter(function (line) { return line.length; })
          .map(function (line) { return line.replace(/^>\s?/, ''); })
          .join('\n');
        return { text: text };
      },
      toBlock: function (obj) {
        return (obj.text || '')
          .split('\n')
          .map(function (line) { return '> ' + line; })
          .join('\n');
      },
      toPreview: function (obj) {
        return '<blockquote>' + (obj.text || '').replace(/\n/g, '<br>') + '</blockquote>';
      }
    });

    // 分隔線
    CMS.registerEditorComponent({
      id: 'divider',
      label: '─ 分隔線',
      fields: [],
      pattern: /^---$/,
      fromBlock: function () { return {}; },
      toBlock: function () { return '---'; },
      toPreview: function () { return '<hr>'; }
    });
  </script>
</body>
</html>
