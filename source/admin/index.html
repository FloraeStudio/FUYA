<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <title>芙婭・後台</title>
  <style>
    /*
      低風險後台微調
      只針對原生 HTML 表單元素（button / input / textarea / select / label）下手，
      不使用 Decap CMS 內部那些會隨版本更新變動的 class name，
      所以升級 decap-cms 版本時這段不會失效或衝突。
    */

    body,
    input,
    textarea,
    select,
    button {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
        'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="search"],
    input[type="url"],
    input[type="number"],
    textarea,
    select {
      border-radius: 6px !important;
      font-size: 16px !important; /* 避免手機輸入時畫面自動放大 */
    }

    textarea {
      line-height: 1.7 !important;
    }

    button {
      border-radius: 6px !important;
      cursor: pointer;
      transition: opacity .15s ease, transform .1s ease;
    }

    button:hover {
      opacity: .85;
    }

    button:active {
      transform: scale(0.97);
    }

    label {
      letter-spacing: .3px;
    }
  </style>
</head>
<body>
  <!-- 版本鎖定，之後要升級再手動改這行 -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
