# ------------------------------------------------
# 委託頁內容（可直接改這裡，不用動 .ejs）
# ------------------------------------------------
# 方案星星：由小到大排列，呼應「委託星最大最亮」的概念
commission_plans:
  - key: surprise
    name: 驚喜包
    range: '-'
    price: NT$0.4/字
    note: 不提供試稿
  - key: short
    name: 短篇小品
    range: 200-500 字/篇
    price: NT$200/篇
    note: 情境速寫、短篇對話等
  - key: mid
    name: 非商業委託
    range: 3000 字(含)內
    price: NT$0.5/字
    note: 可自帶劇情或情節討論
  - key: long
    name: 長篇
    range: 3000 字 +
    price: NT$0.6/字
    note: 需詳談篇幅與時程

commission_flow:
  - 提供詳細人物設定、字數與大致情境或其他特殊要求。
  - 我會回覆是否接稿、預計交件時間與報價。
  - 收取訂金排單，確認後開始動筆，初稿階段有兩次修改機會。
  - 完稿後交件，有一次小幅修改機會，不接受更動情節的修改。

commission_faq:
  - q: 可以接取夢向或者二創角色 / 世界觀嗎？
    a: 可以，原創、夢向以及二創皆可委託，附上足夠的設定及世界觀即可，請盡量避免直接貼作品連結給我。作品或設定苦手才會有概率婉拒。
  - q: 我需要提供什麼資料？
    a: 角色雙方詳細設定，包括但不限於角色性格、對彼此的稱呼，如有雙人互動參考會更好。
  - q: 金額與字數是如何計算的？
    a: 交稿方式默認Telegraph，字數以Word為準（含標點符號），會在交稿時一併附上統計，金額為小數點後無條件進位。
  - q: 委託以後可以放到設定串或者河道展示嗎？
    a: 當然可以！您能喜歡我撰寫的故事是我的榮幸。不過委託保留我方交稿後發布至河道、作品集、委託範例與文透之權利，若有角色姓名打碼/僅特定段落可公開等特殊需求，請務必主動提出讓我知道。
  - q: 可以中途取消委託嗎？
    a: 可以，委託成立後如想取消請於3日內提出，扣除手續費後全款退還，若已動筆則僅退50%。逾時無論是否動筆，將不退還訂金。若無告知下消失超過一週，我方有權終止委託，並無法退款。

