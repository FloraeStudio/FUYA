# 首頁最近文章列表要顯示幾篇
recent_count: 6

# 導覽（同時也是首頁星座的五顆星）
# key   -> 對應 CSS 的 .sp-{key}，不要更動
# slug  -> 分類頁網址，主頁請留空字串
# desc  -> 星星旁邊的一句話說明
# badge -> 選填，星星旁邊的小標籤（例如「開放中」）
nav:
  - key: home
    name: 主頁
    slug: ''
    desc: 
  - key: proj
    name: 企劃
    slug: projects
    desc: 
    badge: 連載中
  - key: gacha
    name: 轉蛋
    slug: gacha
    desc: 
  - key: comm
    name: 委託
    slug: commission
    desc: 
    badge: 開放中
  - key: misc
    name: 雜談
    slug: misc
    desc: 

# 分類 slug -> 中文顯示名稱
categoryLabels:
  projects: 企劃
  gacha: 轉蛋
  commission: 委託
  misc: 雜談

# ------------------------------------------------
# 委託頁內容（可直接改這裡，不用動 .ejs）
# ------------------------------------------------
# 方案星星：由小到大排列，呼應「委託星最大最亮」的概念
commission_plans:
  - key: surprise
    name: 驚喜包代寫
    range: 300–1000 字
    price: NT$150–250
    note: 丟提示給我，寫完直接給你，不先過稿也不修改。
  - key: short
    name: 小品
    range: 500–1500 字
    price: NT$300 起
    note: 情境速寫、短篇對話
  - key: mid
    name: 短篇
    range: 1500–4000 字
    price: NT$800 起
    note: 完整起承轉合的小故事
  - key: long
    name: 長文
    range: 4000 字以上
    price: 面議
    note: 需詳談篇幅與時程

commission_flow:
  - 私訊或透過表單告訴我想要的類型、字數與大致情境。
  - 我會回覆是否接稿、預估交件時間與報價。
  - 確認後開始動筆，中途可以討論調整方向。
  - 完稿後交件，小幅修改一次以內都沒問題。

commission_faq:
  - q: 可以指定角色 / 世界觀嗎？
    a: 可以，原創或二創都收，附上足夠的設定或連結即可。
  - q: 委託滿了怎麼辦？
    a: 狀態列會顯示目前是否開放，滿單時可以留言候補。
  - q: 可以中途取消嗎？
    a: 可以，會依照已完成的進度計算費用。

