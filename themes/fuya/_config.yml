# ------------------------------------------------
# fuya 主題設定
# ------------------------------------------------

# 首頁最近文章列表要顯示幾篇
recent_count: 6

# 導覽（同時也是首頁星座的五顆星）
# key   -> 對應 CSS 的 .sp-{key}，不要更動
# slug  -> 分類頁網址，主頁請留空字串
# desc  -> 星星旁邊的一句話說明
# badge -> 選填，星星旁邊的小標籤（例如「開放中」）
nav:
  - key: home
    name: 主頁
    slug: ''
    desc: 關於芙婭
  - key: proj
    name: 企劃
    slug: projects
    desc: 故事正在發生
    badge: 規劃中
  - key: gacha
    name: 轉蛋
    slug: gacha
    desc: 蘊含了驚喜的文字
  - key: comm
    name: 委託
    slug: commission
    desc: 訂製一段專屬故事
    badge: 開放中
  - key: misc
    name: 雜談
    slug: misc
    desc: 隨手寫下的文字

# 分類 slug -> 中文顯示名稱
categoryLabels:
  projects: 企劃
  gacha: 轉蛋
  commission: 委託
  misc: 雜談

# ------------------------------------------------
# 委託頁內容（可直接改這裡，不用動 .ejs）
# ------------------------------------------------
# 方案星星：由小到大排列，呼應「委託星最大最亮」的概念
commission_plans:
  - key: surprise
    name: 驚喜包
    range: '-'
    price: NT$0.4/字
    note: 不提供試稿
  - key: short
    name: 短篇小品
    range: 200-500 字/篇
    price: NT$200/篇
    note: 情境速寫、短篇對話
  - key: mid
    name: 非商業委託
    range: 3000 字(含)內
    price: NT$0.5/字
    note: 可自帶劇情大綱、特定情節、tag討論
  - key: long
    name: 長篇
    range: 3000 字 +
    price: NT$0.6/字
    note: 需詳談篇幅與時程

commission_flow:
  - 私訊或透過表單告訴我想要的類型、字數與大致情境。
  - 我會回覆是否接稿、預估交件時間與報價。
  - 確認後開始動筆，中途可以討論調整方向。
  - 完稿後交件，小幅修改一次以內都沒問題。

commission_faq:
  - q: 可以指定角色 / 世界觀嗎？
    a: 可以，原創或二創都收，附上足夠的設定或連結即可。
  - q: 委託滿了怎麼辦？
    a: 狀態列會顯示目前是否開放，滿單時可以留言候補。
  - q: 可以中途取消嗎？
    a: 可以，會依照已完成的進度計算費用。

